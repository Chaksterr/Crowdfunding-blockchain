name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts — compile, test, coverage, deploy dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npx hardhat compile

      - name: Test
        run: npx hardhat test

      - name: Coverage
        run: npx hardhat coverage

      - name: Deployment smoke test (in-process Hardhat network)
        run: npx hardhat ignition deploy ignition/modules/Crowdfunding.js --network hardhat

      - name: Sync ABI and address into the frontend
        run: npm run sync

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend — install and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend (skipped until frontend/package.json exists)
        run: |
          if [ -f frontend/package.json ]; then
            npm ci --prefix frontend
            npm run build --prefix frontend
          else
            echo "frontend/package.json absent — nothing to build yet."
          fi

      - name: Test frontend (only when a test script exists)
        run: |
          if [ -f frontend/package.json ] && node -e "process.exit(require('./frontend/package.json').scripts?.test ? 0 : 1)"; then
            npm test --prefix frontend
          else
            echo "No frontend test script yet — skipped."
          fi
